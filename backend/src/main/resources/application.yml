server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: expirymate-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/expirymate?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  mode: ${APP_MODE:local-demo}
  demo-user-id: ${DEMO_USER_ID:00000000-0000-4000-8000-000000000001}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
